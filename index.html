<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0877e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="application-name" content="Presensi Guru">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Presensi Guru - UPTD SDN 34 Parepare</title>
<style>
:root{--primary:#0877e8;--primary2:#1267c9;--bg:#eef4fb;--text:#162235;--muted:#6e7d90;--danger:#b9252d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
body{min-height:100dvh}
.app{position:relative;width:100%;height:100dvh;min-height:100vh;background:var(--bg)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.loader{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:linear-gradient(160deg,#fbfdff,#eef4fb)}
.logo-box{width:136px;height:136px;padding:10px;border-radius:34px;background:#fff;display:grid;place-items:center;border:1px solid rgba(20,70,120,.08);box-shadow:0 18px 46px rgba(20,70,120,.14)}
.logo-box img{width:100%;height:100%;object-fit:contain;border-radius:25px}
.school{font-size:15px;font-weight:900;color:#0d5fae;margin-top:2px}
.loader-title{font-size:27px;font-weight:950;letter-spacing:-.6px}
.loader-status{font-size:13px;color:var(--muted)}
.loader-error{display:none;max-width:560px;padding:13px 15px;border-radius:14px;background:#fff5f5;border:1px solid #efc8cb;color:#9b2028;font-size:13px;line-height:1.5}
.retry,.install{border:0;border-radius:14px;padding:12px 18px;font-weight:900;cursor:pointer}
.retry{display:none;background:#e9f3ff;color:#0c5ca9}
.install{position:fixed;right:16px;bottom:18px;z-index:20;display:none;background:var(--primary);color:#fff;box-shadow:0 12px 28px rgba(8,119,232,.26)}
@media(max-width:600px){
  .logo-box{width:108px;height:108px;border-radius:28px}
  .logo-box img{border-radius:20px}
  .school{font-size:13px}
  .loader-title{font-size:23px}
}
</style>
</head>
<body>
<main class="app">
<section id="loader" class="loader" aria-live="polite">
  <div class="logo-box"><img src="./icons/icon-512.png" alt="Logo UPTD SDN 34 Parepare"></div>
  <div class="school">UPTD SDN 34 PAREPARE</div>
  <div id="loaderTitle" class="loader-title">Presensi Guru</div>
  <div id="loaderStatus" class="loader-status">Memuat aplikasi…</div>
  <div id="loaderError" class="loader-error"></div>
  <button id="retryBtn" class="retry" type="button">Coba Lagi</button>
</section>
<iframe id="appFrame" title="Presensi Guru - UPTD SDN 34 Parepare"
        allow="geolocation; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
<button id="installBtn" class="install" type="button">📲 Pasang Aplikasi</button>
</main>

<script src="./config.js"></script>
<script>
(function() {
  const frame=document.getElementById('appFrame');
  const loader=document.getElementById('loader');
  const loaderTitle=document.getElementById('loaderTitle');
  const loaderStatus=document.getElementById('loaderStatus');
  const loaderError=document.getElementById('loaderError');
  const retryBtn=document.getElementById('retryBtn');
  const installBtn=document.getElementById('installBtn');
  let deferredPrompt=null;

  function showError(title,msg){
    loaderTitle.textContent=title;
    loaderStatus.textContent='';
    loaderError.textContent=msg;
    loaderError.style.display='block';
    retryBtn.style.display='inline-block';
  }

  function loadApp(){
    loaderError.style.display='none';
    retryBtn.style.display='none';
    loader.style.display='flex';
    frame.style.display='none';
    const url=String(window.APP_CONFIG && window.APP_CONFIG.appUrl || '').trim();
    if(!/^https:\/\//i.test(url) || !/\/exec(?:[?#].*)?$/i.test(url)){
      showError('URL Web App belum valid','Periksa file config.js dan pastikan appUrl menggunakan URL Google Apps Script yang berakhiran /exec.');
      return;
    }
    try{frame.src=url;}catch(e){
      showError('Aplikasi gagal dimuat','Browser tidak dapat membuka halaman aplikasi utama.');
      return;
    }
    frame.style.display='block';
    clearTimeout(window.__loadTimer);
    window.__loadTimer=setTimeout(function(){
      if(loader.style.display!=='none'){
        showError('Aplikasi belum merespons','Periksa deployment Web App, izin akses, dan koneksi internet.');
      }
    },20000);
  }

  frame.addEventListener('load',function(){
    clearTimeout(window.__loadTimer);
    loader.style.display='none';
  });

  retryBtn.addEventListener('click',loadApp);

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    if(!window.matchMedia('(display-mode: standalone)').matches){
      installBtn.style.display='block';
    }
  });

  installBtn.addEventListener('click',async function(){
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    try{await deferredPrompt.userChoice;}catch(e){}
    deferredPrompt=null;
    installBtn.style.display='none';
  });

  window.addEventListener('appinstalled',function(){
    installBtn.style.display='none';
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(function(){});
    });
  }

  loadApp();
})();
</script>
</body>
</html>
