<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b72d8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<title>Presensi Guru - UPTD SDN 34 Parepare</title>
<style>
:root{--primary:#0b72d8;--text:#14263d;--muted:#6f7f91;--bg:#eef4fb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
.app{width:100%;height:100dvh;min-height:100vh;position:relative;background:var(--bg)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.loader{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;padding:24px;text-align:center;background:linear-gradient(145deg,#fbfdff,#eef4fb)}
.logo-box{width:132px;height:132px;border-radius:34px;background:#fff;padding:10px;display:grid;place-items:center;box-shadow:0 18px 44px rgba(16,76,133,.15);border:1px solid rgba(255,255,255,.9)}
.logo{width:100%;height:100%;object-fit:contain}.school{font-size:15px;font-weight:850;color:#0759a8;letter-spacing:.1px}.loader strong{font-size:26px;letter-spacing:-.4px}.loader span{font-size:13px;color:var(--muted);line-height:1.5}.loader .error{display:none;margin-top:5px;padding:14px 16px;border:1px solid #efc9c9;background:#fff7f7;border-radius:14px;color:#a42e2e;max-width:540px;font-size:13px;line-height:1.5}.retry{display:none;margin-top:6px;border:0;border-radius:13px;padding:12px 18px;background:#e9f3ff;color:#0759a8;font-weight:850}.install{position:fixed;right:16px;bottom:18px;z-index:20;display:none;border:0;border-radius:15px;padding:13px 17px;background:var(--primary);color:#fff;font-weight:850;box-shadow:0 10px 28px rgba(11,114,216,.24)}
@media(max-width:600px){.logo-box{width:108px;height:108px;border-radius:28px}.school{font-size:13px}.loader strong{font-size:22px}}
</style>
</head>
<body>
<main class="app">
<section class="loader" id="loader" aria-live="polite">
<div class="logo-box"><img class="logo" src="./icon-512.png" alt="Logo UPTD SDN 34 Parepare"></div>
<div class="school">UPTD SDN 34 PAREPARE</div>
<strong id="loaderTitle">Presensi Guru</strong><span id="loaderText">Memuat aplikasi…</span>
<div id="loaderError" class="error"></div><button id="retryBtn" class="retry" type="button">Coba Lagi</button>
</section>
<iframe id="appFrame" title="Presensi Guru - UPTD SDN 34 Parepare" allow="geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<button id="installBtn" class="install" type="button">📲 Pasang Aplikasi</button>
</main>
<script src="./config.js"></script>
<script>
const frame=document.getElementById('appFrame'),loader=document.getElementById('loader'),loaderTitle=document.getElementById('loaderTitle'),loaderText=document.getElementById('loaderText'),loaderError=document.getElementById('loaderError'),retryBtn=document.getElementById('retryBtn'),installBtn=document.getElementById('installBtn');
let deferredPrompt=null;
function showError(title,msg){loaderTitle.textContent=title;loaderText.textContent='';loaderError.textContent=msg;loaderError.style.display='block';retryBtn.style.display='inline-block'}
function loadApp(){loaderError.style.display='none';retryBtn.style.display='none';loaderTitle.textContent='Presensi Guru';loaderText.textContent='Memuat aplikasi…';loader.style.display='flex';frame.style.display='none';
if(location.hostname.includes('script.google.com')){showError('PWA belum ditempatkan dengan benar','Host PWA ini melalui HTTPS seperti GitHub Pages. Jangan memasukkan index.html PWA ke project Apps Script.');return}
const url=String(window.APP_CONFIG?.appUrl||'').trim();if(!/^https:\/\//i.test(url)||!/\/exec(?:[?#].*)?$/i.test(url)){showError('URL Web App belum diatur','Periksa config.js dan isi appUrl dengan URL Web App /exec.');return}
frame.src=url;frame.style.display='block';window.clearTimeout(window._loadTimer);window._loadTimer=window.setTimeout(()=>{if(loader.style.display!=='none')showError('Aplikasi belum merespons','Periksa koneksi internet, URL /exec, dan pengaturan akses Web App.')},15000)}
frame.addEventListener('load',()=>{window.clearTimeout(window._loadTimer);loader.style.display='none'});retryBtn.addEventListener('click',loadApp);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});installBtn.addEventListener('click',async()=>{if(!deferredPrompt){return}deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;installBtn.style.display='none'});window.addEventListener('appinstalled',()=>{installBtn.style.display='none'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));loadApp();
</script>
</body>
</html>
