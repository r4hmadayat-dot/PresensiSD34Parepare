<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0877e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="application-name" content="Presensi Guru">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Presensi Guru - UPTD SDN 34 Parepare</title>
<style>
:root{--primary:#0877e8;--primary2:#1267c9;--bg:#eef4fb;--text:#162235;--muted:#6e7d90;--danger:#b9252d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}
body{min-height:100dvh}
.app{position:relative;width:100%;height:100dvh;min-height:100vh;background:var(--bg)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.loader{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:linear-gradient(160deg,#fbfdff,#eef4fb)}
.logo-box{width:136px;height:136px;padding:10px;border-radius:34px;background:#fff;display:grid;place-items:center;border:1px solid rgba(20,70,120,.08);box-shadow:0 18px 46px rgba(20,70,120,.14)}
.logo-box img{width:100%;height:100%;object-fit:contain;border-radius:25px}
.school{font-size:15px;font-weight:900;color:#0d5fae;margin-top:2px}
.loader-title{font-size:27px;font-weight:950;letter-spacing:-.6px}
.loader-status{font-size:13px;color:var(--muted)}
.loader-error{display:none;max-width:560px;padding:13px 15px;border-radius:14px;background:#fff5f5;border:1px solid #efc8cb;color:#9b2028;font-size:13px;line-height:1.5}
.retry,.install{border:0;border-radius:14px;padding:12px 18px;font-weight:900;cursor:pointer}
.retry{display:none;background:#e9f3ff;color:#0c5ca9}
.install{position:fixed;right:16px;bottom:18px;z-index:20;display:none;background:var(--primary);color:#fff;box-shadow:0 12px 28px rgba(8,119,232,.26)}
@media(max-width:600px){
  .logo-box{width:108px;height:108px;border-radius:28px}
  .logo-box img{border-radius:20px}
  .school{font-size:13px}
  .loader-title{font-size:23px}
}

.pwa-camera{position:fixed;inset:0;z-index:50;background:rgba(6,18,32,.78);display:none;align-items:flex-end;justify-content:center;padding:0}
.pwa-camera.open{display:flex}
.pwa-camera-card{width:min(560px,100%);max-height:94dvh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px;box-shadow:0 -12px 36px rgba(0,0,0,.22)}
.pwa-camera-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.pwa-camera-head h2{margin:0;font-size:22px;color:#162235}.pwa-camera-close{width:40px;height:40px;border:0;border-radius:50%;background:#eef2f6;font-size:22px;cursor:pointer}
.pwa-camera-stage{position:relative;background:#0b1220;border-radius:18px;overflow:hidden;aspect-ratio:3/4;margin:12px 0}.pwa-camera-stage video,.pwa-camera-stage img{width:100%;height:100%;object-fit:cover;display:block}.pwa-camera-stage img{display:none}.pwa-camera-guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;height:58%;border:2px dashed rgba(255,255,255,.75);border-radius:48% 48% 42% 42%;box-shadow:0 0 0 9999px rgba(0,0,0,.10);pointer-events:none}
.pwa-camera-status{padding:10px 12px;border-radius:12px;background:#f6f9fc;border:1px solid #e2e9f1;color:#58697c;font-size:13px;text-align:center}.pwa-camera-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pwa-camera-btn{min-height:50px;border:0;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer}.pwa-camera-btn.primary{background:#1677e8;color:#fff}.pwa-camera-btn.secondary{background:#eef3f8;color:#27425d}.pwa-camera-btn.ok{background:#138a52;color:#fff}.pwa-camera-btn.danger{background:#c92c35;color:#fff}.pwa-camera-note{font-size:11px;color:#7b8999;text-align:center;margin-top:8px;line-height:1.4}.pwa-camera-file{display:none}
</style>
</head>
<body>
<main class="app">
<section id="loader" class="loader" aria-live="polite">
  <div class="logo-box"><img src="./icon-512.png" alt="Logo UPTD SDN 34 Parepare"></div>
  <div class="school">UPTD SDN 34 PAREPARE</div>
  <div id="loaderTitle" class="loader-title">Presensi Guru</div>
  <div id="loaderStatus" class="loader-status">Memuat aplikasi…</div>
  <div id="loaderError" class="loader-error"></div>
  <button id="retryBtn" class="retry" type="button">Coba Lagi</button>
</section>
<iframe id="appFrame" title="Presensi Guru - UPTD SDN 34 Parepare"
        allow="geolocation; camera; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
<section id="pwaCamera" class="pwa-camera" aria-modal="true" role="dialog">
  <div class="pwa-camera-card">
    <div class="pwa-camera-head">
      <div><h2 id="pwaCameraTitle">📷 Foto Absen</h2><div style="font-size:12px;color:#728094">Foto wajah diperlukan untuk mencatat kehadiran.</div></div>
      <button id="pwaCameraClose" class="pwa-camera-close" type="button">×</button>
    </div>
    <div class="pwa-camera-stage">
      <video id="pwaCameraVideo" autoplay playsinline muted></video>
      <img id="pwaCameraPreview" alt="Pratinjau foto">
      <div class="pwa-camera-guide"></div>
    </div>
    <div id="pwaCameraStatus" class="pwa-camera-status">Menyiapkan kamera...</div>
    <input id="pwaCameraFile" class="pwa-camera-file" type="file" accept="image/*" capture="user">
    <div id="pwaCameraLiveActions" class="pwa-camera-actions">
      <button id="pwaCameraSwitch" class="pwa-camera-btn secondary" type="button">🔄 Ganti Kamera</button>
      <button id="pwaCameraCapture" class="pwa-camera-btn primary" type="button">📸 Ambil Foto</button>
    </div>
    <div id="pwaCameraPreviewActions" class="pwa-camera-actions" style="display:none">
      <button id="pwaCameraRetake" class="pwa-camera-btn secondary" type="button">↩ Ambil Ulang</button>
      <button id="pwaCameraConfirm" class="pwa-camera-btn ok" type="button">✓ Gunakan Foto & Absen</button>
    </div>
    <div class="pwa-camera-actions" style="grid-template-columns:1fr">
      <button id="pwaCameraFallback" class="pwa-camera-btn secondary" type="button">📱 Gunakan Kamera HP</button>
    </div>
    <div class="pwa-camera-note">Kamera aktif hanya selama proses pengambilan foto. Pastikan wajah terlihat jelas.</div>
  </div>
</section>

<button id="installBtn" class="install" type="button">📲 Pasang Aplikasi</button>
</main>

<script src="./config.js"></script>
<script>
(function() {
  const frame=document.getElementById('appFrame');
  const loader=document.getElementById('loader');
  const loaderTitle=document.getElementById('loaderTitle');
  const loaderStatus=document.getElementById('loaderStatus');
  const loaderError=document.getElementById('loaderError');
  const retryBtn=document.getElementById('retryBtn');
  const installBtn=document.getElementById('installBtn');
  let deferredPrompt=null;

  function showError(title,msg){
    loaderTitle.textContent=title;
    loaderStatus.textContent='';
    loaderError.textContent=msg;
    loaderError.style.display='block';
    retryBtn.style.display='inline-block';
  }

  function loadApp(){
    loaderError.style.display='none';
    retryBtn.style.display='none';
    loader.style.display='flex';
    frame.style.display='none';
    const url=String(window.APP_CONFIG && window.APP_CONFIG.appUrl || '').trim();
    if(!/^https:\/\//i.test(url) || !/\/exec(?:[?#].*)?$/i.test(url)){
      showError('URL Web App belum valid','Periksa file config.js dan pastikan appUrl menggunakan URL Google Apps Script yang berakhiran /exec.');
      return;
    }
    try{frame.src=url;}catch(e){
      showError('Aplikasi gagal dimuat','Browser tidak dapat membuka halaman aplikasi utama.');
      return;
    }
    frame.style.display='block';
    clearTimeout(window.__loadTimer);
    window.__loadTimer=setTimeout(function(){
      if(loader.style.display!=='none'){
        showError('Aplikasi belum merespons','Periksa deployment Web App, izin akses, dan koneksi internet.');
      }
    },20000);
  }

  frame.addEventListener('load',function(){
    clearTimeout(window.__loadTimer);
    loader.style.display='none';
  });

  retryBtn.addEventListener('click',loadApp);

  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();
    deferredPrompt=e;
    if(!window.matchMedia('(display-mode: standalone)').matches){
      installBtn.style.display='block';
    }
  });

  installBtn.addEventListener('click',async function(){
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    try{await deferredPrompt.userChoice;}catch(e){}
    deferredPrompt=null;
    installBtn.style.display='none';
  });

  window.addEventListener('appinstalled',function(){
    installBtn.style.display='none';
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(function(){});
    });
  }

  loadApp();
})();

  const cameraShell=document.getElementById('pwaCamera');
  const cameraVideo=document.getElementById('pwaCameraVideo');
  const cameraPreview=document.getElementById('pwaCameraPreview');
  const cameraStatus=document.getElementById('pwaCameraStatus');
  const cameraTitle=document.getElementById('pwaCameraTitle');
  const cameraLiveActions=document.getElementById('pwaCameraLiveActions');
  const cameraPreviewActions=document.getElementById('pwaCameraPreviewActions');
  const cameraFile=document.getElementById('pwaCameraFile');
  const cameraConfirm=document.getElementById('pwaCameraConfirm');
  let pwaCameraStream=null,pwaCameraFacing='user',pwaCameraType='',pwaPhotoData='';

  function pwaStopCamera(){
    if(pwaCameraStream){pwaCameraStream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});pwaCameraStream=null}
    if(cameraVideo)cameraVideo.srcObject=null;
  }
  function pwaCloseCamera(){
    pwaStopCamera();pwaCameraType='';pwaPhotoData='';cameraShell.classList.remove('open');
    cameraPreview.src='';cameraPreview.style.display='none';cameraVideo.style.display='block';
    cameraLiveActions.style.display='grid';cameraPreviewActions.style.display='none';
  }
  async function pwaStartCamera(){
    pwaStopCamera();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){cameraStatus.textContent='Kamera langsung tidak tersedia. Gunakan tombol Kamera HP.';return}
    try{
      pwaCameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:pwaCameraFacing},width:{ideal:720},height:{ideal:960}}});
      cameraVideo.srcObject=pwaCameraStream;cameraVideo.style.display='block';cameraPreview.style.display='none';
      cameraLiveActions.style.display='grid';cameraPreviewActions.style.display='none';
      cameraStatus.textContent='Kamera siap. Posisikan wajah lalu tekan “Ambil Foto”.';
      await cameraVideo.play().catch(()=>{});
    }catch(e){
      const n=String(e&&e.name||'');
      cameraStatus.textContent=n==='NotAllowedError'?'Izin kamera ditolak. Gunakan “Kamera HP” atau izinkan kamera untuk situs ini.':n==='NotFoundError'?'Kamera tidak ditemukan.':'Kamera tidak dapat dibuka. Gunakan “Kamera HP”.';
    }
  }
  function pwaOpenCamera(type){
    pwaCameraType=type;pwaPhotoData='';
    cameraTitle.textContent=type==='masuk'?'📷 Foto Absen Masuk':'📷 Foto Absen Pulang';
    cameraStatus.textContent='Menyiapkan kamera...';
    cameraShell.classList.add('open');
    pwaStartCamera();
  }
  function pwaCapture(){
    if(!cameraVideo.videoWidth||!cameraVideo.videoHeight){cameraStatus.textContent='Kamera belum siap. Tunggu sebentar lalu coba lagi.';return}
    const c=document.createElement('canvas'),maxW=900,maxH=1200;let w=cameraVideo.videoWidth,h=cameraVideo.videoHeight,s=Math.min(1,maxW/w,maxH/h);w=Math.round(w*s);h=Math.round(h*s);
    c.width=w;c.height=h;c.getContext('2d').drawImage(cameraVideo,0,0,w,h);
    pwaPhotoData=c.toDataURL('image/jpeg',0.78);
    cameraPreview.src=pwaPhotoData;cameraPreview.style.display='block';cameraVideo.style.display='none';pwaStopCamera();
    cameraLiveActions.style.display='none';cameraPreviewActions.style.display='grid';
    cameraStatus.textContent='Periksa foto, lalu pilih “Gunakan Foto & Absen”.';
  }
  async function pwaHandleFile(){
    const f=cameraFile.files&&cameraFile.files[0];if(!f)return;
    try{
      const reader=new FileReader();
      reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),maxW=900,maxH=1200,s=Math.min(1,maxW/img.width,maxH/img.height);c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);pwaPhotoData=c.toDataURL('image/jpeg',0.78);cameraPreview.src=pwaPhotoData;cameraPreview.style.display='block';cameraVideo.style.display='none';cameraLiveActions.style.display='none';cameraPreviewActions.style.display='grid';cameraStatus.textContent='Periksa foto, lalu pilih “Gunakan Foto & Absen”.'};img.src=reader.result};
      reader.readAsDataURL(f);
    }catch(e){cameraStatus.textContent='Foto tidak dapat diproses.'}
  }
  function pwaConfirm(){
    if(!pwaPhotoData||!frame.contentWindow)return;
    cameraConfirm.disabled=true;cameraConfirm.textContent='Menyimpan...';
    frame.contentWindow.postMessage({type:'PRESENSI_CAMERA_RESULT',attendanceType:pwaCameraType,photoData:pwaPhotoData},'*');
    setTimeout(()=>{cameraConfirm.disabled=false;cameraConfirm.textContent='✓ Gunakan Foto & Absen';pwaCloseCamera()},150);
  }
  document.getElementById('pwaCameraClose').addEventListener('click',pwaCloseCamera);
  document.getElementById('pwaCameraCapture').addEventListener('click',pwaCapture);
  document.getElementById('pwaCameraRetake').addEventListener('click',()=>{cameraFile.value='';cameraPreview.src='';cameraPreview.style.display='none';cameraVideo.style.display='block';cameraLiveActions.style.display='grid';cameraPreviewActions.style.display='none';cameraStatus.textContent='Menyiapkan kamera...';pwaStartCamera()});
  document.getElementById('pwaCameraSwitch').addEventListener('click',()=>{pwaCameraFacing=pwaCameraFacing==='user'?'environment':'user';pwaStartCamera()});
  document.getElementById('pwaCameraFallback').addEventListener('click',()=>{cameraFile.value='';cameraFile.click()});
  cameraFile.addEventListener('change',pwaHandleFile);
  window.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow)return;
    const d=event.data||{};
    if(d.type==='PRESENSI_CAMERA_REQUEST'&&(d.attendanceType==='masuk'||d.attendanceType==='pulang'))pwaOpenCamera(d.attendanceType);
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pwaStopCamera()});
</script>
</body>
</html>
